name: Run OTC Bot

on:
  schedule:
    - cron: '0 */6 * * *'  # إعادة تشغيل البوت تلقائياً كل 6 ساعات لضمان استمراريته بدون توقف
  workflow_dispatch:      # لتمكين التشغيل اليدوي متى شئت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run bot script
      run: |
        python bot.py
